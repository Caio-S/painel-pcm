<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrar · PCM — CRV Industrial</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body style="background:var(--navy);min-height:100vh;display:flex;align-items:center;justify-content:center">
<div style="width:100%;max-width:360px;padding:0 16px">
  <div style="text-align:center;margin-bottom:22px">
    <img src="{{ url_for('static', filename='img/logo_default.png') }}" alt="CRV Industrial" style="height:44px;background:#fff;border-radius:8px;padding:6px 10px">
    <div style="color:#fff;font-size:11px;letter-spacing:.16em;text-transform:uppercase;margin-top:12px">PCM — Planejamento e Controle de Manutenção</div>
  </div>
  <form method="POST" style="background:var(--card);border-radius:6px;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.35)">
    <h1 style="margin:0 0 16px;font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:var(--navy)">Entrar</h1>
    {% if erro %}<div style="background:var(--red-bg);color:var(--red);border-radius:4px;padding:9px 11px;font-size:12.5px;font-weight:700;margin-bottom:13px">{{ erro }}</div>{% endif %}
    <div class="f"><label>Usuário</label><input name="usuario" autofocus autocomplete="username" required></div>
    <div class="f" style="margin-bottom:16px"><label>Senha</label><input name="senha" type="password" autocomplete="current-password" required></div>
    <button class="btn btn-dark" type="submit" style="width:100%;padding:10px">Entrar</button>
  </form>
</div>
</body>
</html>
